name: Validate HumanityAI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic repository validation
        run: python scripts/validate_repo.py

      - name: Validate ecosystem resource registry
        run: python scripts/validate_resources.py

      - name: Validate prediction registry
        run: python scripts/validate_predictions.py

      - name: Validate external agent task queue
        run: python scripts/validate_agent_tasks.py

      - name: Test external PR manifest gate
        run: python -m unittest tests/test_pr_manifest_validator.py

      - name: Test security boundaries
        run: python -m unittest tests/test_security_boundaries.py

      - name: Validate security policy structure
        env:
          GITHUB_EVENT_NAME: structure_only
        run: python scripts/validate_security_boundaries.py

      - name: Validate external PR contribution manifest
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/validate_pr_manifest.py

      - name: Enforce prompt-injection and human-review boundary
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          python scripts/validate_security_boundaries.py
