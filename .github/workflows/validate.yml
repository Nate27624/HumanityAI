name: Validate HumanityAI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic repository validation
        run: python scripts/validate_repo.py

      - name: Validate ecosystem resource registry
        run: python scripts/validate_resources.py

      - name: Validate prediction registry
        run: python scripts/validate_predictions.py

      - name: Validate external agent task queue
        run: python scripts/validate_agent_tasks.py
