name: Validate HumanityAI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic repository validation
        run: python scripts/validate_repo.py

      - name: Validate ecosystem resource registry
        run: python scripts/validate_resources.py

      - name: Validate prediction registry
        run: python scripts/validate_predictions.py

      - name: Validate external agent task queue
        run: python scripts/validate_agent_tasks.py

      - name: Test external PR manifest gate
        run: python -m unittest tests/test_pr_manifest_validator.py

      - name: Validate external PR contribution manifest
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/validate_pr_manifest.py
